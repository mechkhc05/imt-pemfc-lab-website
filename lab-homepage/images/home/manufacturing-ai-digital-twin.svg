<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#eef2f0"/>
  <line x1="50" y1="480" x2="750" y2="480" stroke="#c7d2ce" stroke-width="2"/>

  <!-- data flow between physical and digital -->
  <line x1="350" y1="300" x2="370" y2="300" stroke="#a85a2a" stroke-width="3" stroke-dasharray="8 7"/>
  <line x1="430" y1="300" x2="450" y2="300" stroke="#a85a2a" stroke-width="3" stroke-dasharray="8 7"/>
  <polygon points="450,300 438,293 438,307" fill="#a85a2a"/>
  <text x="400" y="255" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#7a3f1c" letter-spacing="1">DATA</text>

  <!-- AI model chip, center -->
  <g transform="translate(370,335)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#ffffff" stroke="#1e6b63" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="14" fill="none" stroke="#1e6b63" stroke-width="2.5"/>
    <line x1="0" y1="15" x2="-10" y2="15" stroke="#1e6b63" stroke-width="2.5"/>
    <line x1="0" y1="45" x2="-10" y2="45" stroke="#1e6b63" stroke-width="2.5"/>
    <line x1="60" y1="15" x2="70" y2="15" stroke="#1e6b63" stroke-width="2.5"/>
    <line x1="60" y1="45" x2="70" y2="45" stroke="#1e6b63" stroke-width="2.5"/>
    <line x1="15" y1="0" x2="15" y2="-10" stroke="#1e6b63" stroke-width="2.5"/>
    <line x1="45" y1="0" x2="45" y2="-10" stroke="#1e6b63" stroke-width="2.5"/>
    <line x1="15" y1="60" x2="15" y2="70" stroke="#1e6b63" stroke-width="2.5"/>
    <line x1="45" y1="60" x2="45" y2="70" stroke="#1e6b63" stroke-width="2.5"/>
  </g>
  <text x="400" y="425" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e6b63" letter-spacing="1">AI MODEL</text>

  <!-- LEFT: physical manufacturing -->
  <g>
    <g transform="translate(95,115)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#a85a2a" stroke-width="5"/>
      <circle cx="0" cy="0" r="7" fill="#a85a2a"/>
      <g stroke="#a85a2a" stroke-width="5">
        <line x1="0" y1="-30" x2="0" y2="-22"/>
        <line x1="0" y1="30" x2="0" y2="22"/>
        <line x1="-30" y1="0" x2="-22" y2="0"/>
        <line x1="30" y1="0" x2="22" y2="0"/>
        <line x1="-21" y1="-21" x2="-15" y2="-15"/>
        <line x1="21" y1="-21" x2="15" y2="-15"/>
        <line x1="-21" y1="21" x2="-15" y2="15"/>
        <line x1="21" y1="21" x2="15" y2="15"/>
      </g>
    </g>

    <rect x="140" y="360" width="140" height="110" rx="6" fill="#8a6a52"/>
    <rect x="150" y="330" width="30" height="40" fill="#6b5340"/>
    <g stroke="#7a3f1c" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="210" y1="330" x2="210" y2="230"/>
      <line x1="210" y1="230" x2="270" y2="190"/>
      <line x1="270" y1="190" x2="270" y2="150"/>
    </g>
    <circle cx="210" cy="230" r="9" fill="#a85a2a"/>
    <circle cx="270" cy="190" r="9" fill="#a85a2a"/>
    <rect x="255" y="130" width="30" height="24" rx="3" fill="#a85a2a"/>

    <rect x="60" y="460" width="280" height="16" rx="4" fill="#c7d2ce"/>
    <circle cx="80" cy="484" r="8" fill="#9aa8a3"/>
    <circle cx="180" cy="484" r="8" fill="#9aa8a3"/>
    <circle cx="280" cy="484" r="8" fill="#9aa8a3"/>
    <rect x="100" y="440" width="26" height="20" rx="3" fill="#a85a2a"/>
    <rect x="200" y="440" width="26" height="20" rx="3" fill="#a85a2a" opacity="0.7"/>

    <text x="200" y="540" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#7a3f1c" font-weight="600">Manufacturing Process</text>
  </g>

  <!-- RIGHT: digital twin -->
  <g>
    <g stroke="#bcded8" stroke-width="1">
      <line x1="460" y1="120" x2="460" y2="470"/>
      <line x1="510" y1="120" x2="510" y2="470"/>
      <line x1="560" y1="120" x2="560" y2="470"/>
      <line x1="610" y1="120" x2="610" y2="470"/>
      <line x1="660" y1="120" x2="660" y2="470"/>
      <line x1="710" y1="120" x2="710" y2="470"/>
      <line x1="760" y1="120" x2="760" y2="470"/>
      <line x1="450" y1="140" x2="770" y2="140"/>
      <line x1="450" y1="190" x2="770" y2="190"/>
      <line x1="450" y1="240" x2="770" y2="240"/>
      <line x1="450" y1="290" x2="770" y2="290"/>
      <line x1="450" y1="340" x2="770" y2="340"/>
      <line x1="450" y1="390" x2="770" y2="390"/>
      <line x1="450" y1="440" x2="770" y2="440"/>
