    <rect x="540" y="360" width="140" height="110" rx="6" fill="none" stroke="#1e6b63" stroke-width="3" stroke-dasharray="6 5"/>
    <rect x="550" y="330" width="30" height="40" fill="none" stroke="#1e6b63" stroke-width="3" stroke-dasharray="6 5"/>
    <g stroke="#1e6b63" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round" fill="none">
      <line x1="610" y1="330" x2="610" y2="230"/>
      <line x1="610" y1="230" x2="670" y2="190"/>
      <line x1="670" y1="190" x2="670" y2="150"/>
    </g>
    <circle cx="610" cy="230" r="9" fill="none" stroke="#1e6b63" stroke-width="3"/>
    <circle cx="670" cy="190" r="9" fill="none" stroke="#1e6b63" stroke-width="3"/>
    <rect x="655" y="130" width="30" height="24" rx="3" fill="none" stroke="#1e6b63" stroke-width="3"/>

    <g stroke="#1e6b63" stroke-width="1.5">
      <line x1="470" y1="410" x2="500" y2="395"/>
      <line x1="470" y1="410" x2="500" y2="425"/>
      <line x1="470" y1="440" x2="500" y2="395"/>
      <line x1="470" y1="440" x2="500" y2="425"/>
      <line x1="500" y1="395" x2="530" y2="410"/>
      <line x1="500" y1="425" x2="530" y2="410"/>
    </g>
    <circle cx="470" cy="410" r="5" fill="#1e6b63"/>
    <circle cx="470" cy="440" r="5" fill="#1e6b63"/>
    <circle cx="500" cy="395" r="5" fill="#1e6b63"/>
    <circle cx="500" cy="425" r="5" fill="#1e6b63"/>
    <circle cx="530" cy="410" r="5" fill="#1e6b63"/>

    <text x="620" y="540" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e6b63" font-weight="600">Digital Twin &amp; AI Model</text>
  </g>
